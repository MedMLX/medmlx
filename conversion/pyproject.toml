[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "medmlx-convert"
version = "0.1.0"
description = "Source-model graph and weight conversion to MLX, Core ML and Core AI"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0 AND BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Joseph Sandoval" }, { name = "Alfredo Sandoval" }]
dependencies = [
  "coreai-torch==0.4.3",
  "coremltools==9.0",
  "gdown>=5.2,<6",
  "h5py==3.15.1",
  "huggingface-hub>=0.34,<2",
  "hydra-core>=1.3.2,<2",
  "iopath>=0.1.10,<0.2",
  "keras==3.15.0",
  "monai==1.6.1",
  "mlx==0.32.4",
  "medmlx-core==0.2.3",
  "nnunetv2==2.8.1",
  "numpy>=2,<2.5",
  "pillow>=13,<14",
  # Requalify both pinned converters when changing this security floor.
  "torch==2.13.0",
  # SAM 3; 5.10.1 fixes chat-template traversal (5.10.0 was yanked).
  "transformers>=5.10.1,<5.11",
]

[dependency-groups]
dev = [
    "h5py-stubs>=0.1.2,<0.2",
    "hypothesis>=6.140",
    "pyright==1.1.414",
    "pytest>=8.3",
    "ruff>=0.12",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/medmlx_convert"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
extend-select = ["TID251", "TID252", "ANN401"]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["recipes","src","tests","scripts"]
extraPaths = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"


[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any" = {msg = "Use a precise type and parse untyped values at the boundary."}
"typing_extensions.Any" = {msg = "Use a precise type and parse untyped values at the boundary."}

[tool.uv]
constraint-dependencies = ["setuptools>=84.1.0", "filelock>=4.2.1", "certifi>=2026.10.19", "urllib3>=2.8.0"]

[tool.uv.sources]
medmlx-core = { path = "../packages/core", editable = true }

[tool.hatch.build.targets.sdist]
only-include = [
  "src/medmlx_convert",
  "pyproject.toml",
  "README.md",
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
]
