[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "medmlx-core"
version = "0.2.3"
description = "Shared MLX runtime for MedMLX model packages"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Joseph Sandoval" }, { name = "Alfredo Sandoval Jr." }]
dependencies = [
  "mlx>=0.32.4,<0.33; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "numpy>=2.0,<3",
]

[project.urls]
Homepage = "https://github.com/MedMLX/medmlx"
Repository = "https://github.com/MedMLX/medmlx"
Documentation = "https://github.com/MedMLX/medmlx/blob/main/packages/core/docs/technical.md"
Issues = "https://github.com/MedMLX/medmlx/issues"

[project.optional-dependencies]
conversion = [
  "torch>=2.6,<3",
]
dev = [
  "pyright==1.1.414",
  "hypothesis>=6.140,<7",
  "monai==1.6.1",
  "numpy>=2.2,<3",
  "pytest>=8.4,<10",
  "ruff>=0.13,<1",
  "torch==2.14.1",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
exclude = ["**/.*"]

[tool.hatch.build.targets.wheel]
sources = ["src"]
include = ["/src/medmlx_core/**/*.py", "/src/medmlx_core/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
extend-select = ["TID251", "TID252", "ANN401"]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["scripts","src","tests"]
extraPaths = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any" = {msg = "Use a precise type and parse untyped values at the boundary."}
"typing_extensions.Any" = {msg = "Use a precise type and parse untyped values at the boundary."}

[tool.hatch.build.targets.sdist]
include = [
  "/src/medmlx_core/**/*.py",
  "/src/medmlx_core/py.typed",
  "/pyproject.toml",
  "/README.md",
  "/LICENSE",
  "/THIRD_PARTY_NOTICES.md",
]
